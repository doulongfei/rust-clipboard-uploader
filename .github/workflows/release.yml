name: CI / Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the version in Cargo.toml after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              throw new Error('Tag does not match Cargo.toml version');
            }
            let exists = true;
            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            const publish = context.ref.startsWith('refs/tags/') ||
              (context.eventName === 'push' && context.ref === 'refs/heads/master' && !exists) ||
              context.payload.inputs?.release === 'true';
            core.setOutput('version', version);
            core.setOutput('publish', String(publish));

  build:
    name: Build (${{ matrix.artifact }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rust-clipboard-uploader-linux
            target: x86_64-unknown-linux-gnu
            release_name: rust-clipboard-uploader-linux
            extension: ''
          - os: macos-14
            artifact: rust-clipboard-uploader-macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact: rust-clipboard-uploader-macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            artifact: rust-clipboard-uploader-windows
            target: x86_64-pc-windows-msvc
            release_name: rust-clipboard-uploader-windows.exe
            extension: .exe
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-xtest0-dev libxcb-glx0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libwayland-egl-backend-dev \
            libssl-dev libgtk-3-dev libegl1-mesa-dev libgles2-mesa-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check formatting and compilation
        run: |
          cargo fmt --check
          cargo check --locked --target ${{ matrix.target }}
      - name: Test macOS launch event handling
        if: runner.os == 'macOS'
        run: |
          clang -fobjc-arc -Wall -Wextra -Werror -mmacosx-version-min=13.0 \
            native/macos.m native/macos_test.m -framework AppKit -framework ServiceManagement \
            -o "$RUNNER_TEMP/macos-launch-test"
          "$RUNNER_TEMP/macos-launch-test"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Configure optional Developer ID signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "Developer ID certificate not configured; using ad-hoc signing."
            exit 0
          fi
          : "${MACOS_SIGNING_IDENTITY:?Signing identity is required with a certificate}"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'signing.p12').write_bytes(base64.b64decode(os.environ['MACOS_CERTIFICATE_P12']))
          PY
          keychain="$RUNNER_TEMP/clipboard-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool store-credentials clipboard-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo 'MACOS_NOTARY_PROFILE=clipboard-notary' >> "$GITHUB_ENV"
            echo "MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          MACOS_TEST_LOGIN_ITEM: '1'
        run: bash scripts/package-macos.sh '${{ matrix.target }}'
      - name: Remove signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [[ -f "$RUNNER_TEMP/clipboard-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/clipboard-signing.keychain-db"
          fi
      - name: Package standalone binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/rust-clipboard-uploader${{ matrix.extension }}' 'dist/${{ matrix.release_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          cp packaging/macos/release-notes.md "$RUNNER_TEMP/release-notes.md"
          for info in artifacts/*-build-info.txt; do
            cat "$info" >> "$RUNNER_TEMP/release-notes.md"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.sha256
            artifacts/*-build-info.txt
            artifacts/rust-clipboard-uploader-linux
            artifacts/rust-clipboard-uploader-windows.exe
